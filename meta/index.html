<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Code Meta Analysis</title>
  <script type="module" src="main.js"></script>
  <link rel="stylesheet" href="../global.css" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0 auto;
      padding: 2rem;
      max-width: 1200px;
      color: #111;
    }

    h1 {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }

    #commit-progress {
      flex: 1;
      margin: 0 1rem;
    }

    #stats dl {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      font-size: 0.85rem;
      margin: 2rem 0 1rem;
      padding: 0.5rem 0;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    #stats dt, #stats dd {
      flex-basis: 16%;
      text-align: center;
      margin: 0;
    }

    #files, #chart {
      max-width: 700px;
      margin: 2rem auto;
    }

    .loc {
      width: 0.4em;
      aspect-ratio: 1;
      border-radius: 50%;
      background: steelblue;
      display: inline-block;
    }

    #chart svg {
      width: 100%;
      height: auto;
      display: block;
    }

    #scatter-story .step {
      padding: 1rem 0;
      border-left: 4px solid transparent;
      padding-left: 1rem;
      max-width: 600px;
      margin: 1rem auto;
    }

    .step.is-active {
      border-left-color: steelblue;
    }

    .step a {
      font-weight: bold;
      color: steelblue;
      text-decoration: none;
    }

    .step a:hover {
      text-decoration: underline;
    }

    #scrolly-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    #scroll-text {
      flex: 1;
    }

    #scroll-viz {
      flex: 1;
      max-width: 700px;
      position: sticky;
      top: 80px;
    }

    @media (min-width: 768px) {
      #scrolly-container {
        flex-direction: row;
        align-items: flex-start;
      }

      #scroll-text {
        flex: 1;
        padding-right: 1rem;
      }

      #scroll-viz {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <h1>Code Meta Analysis</h1>

  <div id="stats">
    <dl>
      <dt>COMMITS</dt><dd id="count-commits"></dd>
      <dt>FILES</dt><dd id="count-files"></dd>
      <dt>TOTAL LOC</dt><dd id="count-loc"></dd>
      <dt>MAX DEPTH</dt><dd id="count-depth"></dd>
      <dt>LONGEST LINE</dt><dd id="count-line"></dd>
      <dt>MAX LINES</dt><dd id="count-max"></dd>
    </dl>
  </div>

  <label>
    Show commits until:
    <input type="range" id="commit-progress" min="0" max="100" value="100">
    <time id="commit-time"></time>
  </label>

  <p id="selection-count">No commits selected</p>
  <dl id="language-breakdown" class="stats"></dl>

  <div id="scrolly-container">
    <div id="scroll-text">
      <div id="scatter-story"></div>
    </div>
    <div id="scroll-viz">
      <div id="files"></div>
      <div id="chart"></div>
    </div>
  </div>
</body>
</html>
